aid: terranox-ai
name: Terranox AI
description: >-
  Terranox AI is the first vertically integrated, AI-powered uranium discovery
  company, founded in 2026 and part of Y Combinator's Winter 2026 batch. The
  company finds high-grade uranium deposits in North America by training machine
  learning models on more than seventy years of exploration outcomes locked in
  thousands of legacy PDFs, drill logs, and hand-drawn geological maps.
  Traditional uranium exploration has a hit rate below one percent and timelines
  measured in decades; Terranox aims to raise that hit rate and compress
  discovery time to help supply the fuel a global nuclear-energy resurgence
  needs — the world must roughly quadruple uranium production by 2050. Terranox
  is a private operating company focused on geoscience and mineral exploration
  and does not currently publish a public developer API, SDK, or developer
  portal. It is backed by General Catalyst, 776 Ventures, and Y Combinator.
